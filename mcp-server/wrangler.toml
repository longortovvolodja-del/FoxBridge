name = "foxbridge-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "FOXBRIDGE_REGISTRY"
class_name = "FoxBridgeRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FoxBridgeRegistry"]

# Required Worker secrets:
# npx wrangler secret put MCP_ACCESS_TOKEN
# npx wrangler secret put FOXBRIDGE_API_KEY
# npx wrangler secret put FOXBRIDGE_REGISTRATION_TOKEN
#
# FoxBridge sends its current HTTPS Quick Tunnel URL to /register.
# The Worker stores the latest registration in the Durable Object.
# No static FOXBRIDGE_BASE_URL is required.

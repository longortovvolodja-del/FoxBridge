# FoxBridge 1.0.1
# Secure default: local access only. Remote access requires TLS.
server:
  bind_address: "127.0.0.1"
  port: 25965
  backlog: 16
security:
  max_requests_per_minute_per_ip: 60
access:
  allow_plugins_directory: true
  allow_logs_directory: true
  max_read_bytes: 524288
  max_upload_bytes: 67108864
uploads:
  enabled: true
tls:
  enabled: false
  keystore: "foxbridge.p12"
  password: "CHANGE_THIS"
mcp:
  # Постоянный адрес Cloudflare Worker, обязательно с путём /register.
  # Пример: https://foxbridge-mcp.<account>.workers.dev/register
  registration_url: ""
  # Повторная регистрация адреса туннеля (секунды).
  registration_interval_seconds: 45
  # Автозапуск Quick Tunnel после старта Minecraft, если регистрация настроена.
  auto_start_tunnel: true

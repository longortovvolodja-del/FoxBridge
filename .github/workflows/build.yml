name: Build FoxBridge
on:
  workflow_dispatch:
  push:
    branches: [ main, master, feature/mcp-server ]
    paths:
      - 'src/**'
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build FoxBridge
        run: mvn -B clean package
      - name: Generate SHA-256 checksum
        run: |
          cd target
          sha256sum FoxBridge-1.0.1.jar > FoxBridge-1.0.1.jar.sha256
      - name: Upload plugin JAR and checksum
        uses: actions/upload-artifact@v4
        with:
          name: FoxBridge-1.0.1
          path: |
            target/FoxBridge-1.0.1.jar
            target/FoxBridge-1.0.1.jar.sha256
          if-no-files-found: error

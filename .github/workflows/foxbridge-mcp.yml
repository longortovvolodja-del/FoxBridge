name: FoxBridge-MCP

on:
  push:
    branches: [feature/mcp-server]
    paths:
      - "mcp-server/**"
      - ".github/workflows/foxbridge-mcp.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/foxbridge-mcp.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck

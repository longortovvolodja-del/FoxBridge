name: Deploy FoxBridge-MCP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          FOXBRIDGE_API_KEY: ${{ secrets.FOXBRIDGE_API_KEY }}
          FOXBRIDGE_REGISTRATION_TOKEN: ${{ secrets.FOXBRIDGE_REGISTRATION_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MCP_ACCESS_TOKEN FOXBRIDGE_API_KEY FOXBRIDGE_REGISTRATION_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Deploy Worker and Durable Object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          FOXBRIDGE_API_KEY: ${{ secrets.FOXBRIDGE_API_KEY }}
          FOXBRIDGE_REGISTRATION_TOKEN: ${{ secrets.FOXBRIDGE_REGISTRATION_TOKEN }}
        run: |
          printf '%s' "$MCP_ACCESS_TOKEN" | npx wrangler secret put MCP_ACCESS_TOKEN
          printf '%s' "$FOXBRIDGE_API_KEY" | npx wrangler secret put FOXBRIDGE_API_KEY
          printf '%s' "$FOXBRIDGE_REGISTRATION_TOKEN" | npx wrangler secret put FOXBRIDGE_REGISTRATION_TOKEN
